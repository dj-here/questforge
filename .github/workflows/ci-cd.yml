name: QuestForge CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ========================================================
  # Backend Testing & Coverage (Minimum 80% pipeline check)
  # ========================================================
  backend-test:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-asyncio
          pip install -e ./backend

      - name: Lint with Ruff
        run: |
          ruff check backend/app

      - name: Run Pytest with Strict 80% Pipeline Coverage
        env:
          TESTING: "True"
          DATABASE_URL: "sqlite:///./test_ci.db"
          SECRET_KEY: "ci-secret-key-32-chars-minimum-length"
          MOCK_LLM: "True"
          SANDBOX_TYPE: "mock"
          HACKERRANK_DRY_RUN: "True"
        run: |
          python -m pytest backend/tests/ -v \
            --cov=backend/app/pipeline \
            --cov-report=term-missing \
            --cov-fail-under=80

  # ========================================================
  # Frontend Lint, Typecheck & Next.js Production Build
  # ========================================================
  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Typecheck & Next.js Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ========================================================
  # Container Build & Security Verification
  # ========================================================
  docker-build:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Sandbox Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: sandbox/Dockerfile
          push: false
          tags: questforge-sandbox:ci

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: questforge-backend:ci

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: questforge-frontend:ci

  # ========================================================
  # Production Deploy Trigger
  # ========================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deployment Notice
        run: |
          echo "CI/CD Pipeline checks passed. Ready for VPS / AWS ECS / Render / Railway deployment."
